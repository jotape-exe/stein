services:
  postgres:
    image: postgres:16-alpine
    container_name: stein-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stein}
      POSTGRES_USER: ${POSTGRES_USER:-stein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stein}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-stein} -d $${POSTGRES_DB:-stein}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
